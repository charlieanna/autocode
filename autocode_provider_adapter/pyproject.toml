[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autocode-provider-adapter"
version = "0.1.0"
description = "Provider-neutral launcher for untouched Autocode checkouts"
requires-python = ">=3.11"
readme = "README.md"

[project.scripts]
autocode-provider = "autocode_provider_adapter.launcher:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
autocode_provider_adapter = ["compatibility-manifest-v1.json"]
