[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autocode-supervisor"
version = "0.7.1"
description = "AutoCode runs your coding agent and won't say 'done' without evidence: independent checks, exact-version approval, and a record of what was verified."
requires-python = ">=3.11"
readme = "README.md"
license = {text = "Apache-2.0"}
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
]
dependencies = ["psutil>=7.0,<8"]

[project.optional-dependencies]
visual = ["Pillow>=11.3,<13"]
visual-test = ["Pillow>=11.3,<13", "playwright>=1.56,<2"]

# Only autocode is public; the other scripts remain internal compatibility aliases.
[project.scripts]
autopilot = "autocode_cli.autocode:cli"
autocode = "autocode_cli.autocode:cli"
autocode-orchestrator = "autocode_cli.autocode_orchestrator:cli"
autoplanner = "autocode_cli.autoplanner:cli"
autocode-build = "autocode_cli.autocode_build:cli"
autoreview = "autocode_cli.autoreview:cli"
autoresolver = "autocode_cli.autoresolver:cli"
autocode-dashboard = "autocode_cli.dashboard.agent_console:main"
autocode-ui = "autocode_cli.autocode_ui:cli"
autocode-tasks = "autocode_cli.autocode_tasks:cli"
autocode-components = "autocode_cli.autocode_components:cli"
autocode-unattended = "autocode_cli.autocode_unattended:cli"
autocode-program = "autocode_cli.autocode_program:cli"
autocode-issue = "autocode_cli.autocode_issue:cli"
autocode-arena = "autocode_cli.autocode_arena:cli"

[tool.autocode.cli]
public-entry-points = ["autocode"]
internal-entry-points = [
    "autopilot", "autocode-orchestrator", "autoplanner", "autocode-build", "autoreview",
    "autoresolver", "autocode-dashboard", "autocode-ui", "autocode-tasks",
    "autocode-components", "autocode-unattended", "autocode-program", "autocode-issue",
    "autocode-arena",
]

[tool.setuptools]
packages = ["autocode_cli", "autocode_cli.dashboard", "autocode_cli.providers", "autocode_cli.units"]
package-dir = {autocode_cli = "tools"}

[tool.setuptools.package-data]
autocode_cli = ["prompts/*.md", "prompts/fragments/*/*.md", "autocode-schemas/*.json", "autocode-schemas/v2/*.json", "autocode_preflight_browser.cjs", "autocode_visual_browser.cjs", "autocode_image_delivery.mjs", "autocode_node_reporter.cjs", "autocode_vitest_reporter.cjs", "figma_inventory_page.js", "provider-matrix.json"]
"autocode_cli.dashboard" = ["*.html", "*.css", "*.js", "assets/fonts/*.woff2", "assets/fonts/*.txt", "assets/*.svg"]
"autocode_cli.providers" = ["configs/*.toml", "*.mjs"]

# --- Lint & type gate (#803) ---
# Ruff: lint, import sorting, formatting. Replaces flake8 + isort + black.
[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [
    ".venv",
    "build",
    "dist",
    "*.egg-info",
    ".autocode",
    ".scenario-runs",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "TID",    # flake8-tidy-imports
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "E402",   # module level import not at top of file — intentional for conditional imports and sys.path manipulation
    "E701",   # multiple statements on one line (colon) — used in compact test assertions
    "E702",   # multiple statements on one line (semicolon) — used in compact test assertions
    "E731",   # lambda assignment — used for concise callbacks
    "B008",   # function call in default argument (common pattern in this codebase)
    "B023",   # function definition does not bind loop variable — intentional late binding in closures
    "SIM108", # use ternary operator (often less readable)
    "SIM117", # nested with statements (sometimes clearer than single with)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]  # assert False is idiomatic in tests
"tools/dashboard/*" = ["TID252"]  # relative imports intentional for try/except fallback
"tools/providers/*" = ["TID252"]  # relative imports intentional for try/except fallback
"tools/units/*" = ["TID252"]      # relative imports intentional for try/except fallback

[tool.ruff.lint.isort]
known-first-party = ["autocode_cli", "tools", "tests", "scenarios"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

# Mypy: type checking. Start permissive, ratchet toward strict.
[tool.mypy]
python_version = "3.11"
# The runtime targets macOS and Linux (Windows runs through WSL), so check
# against the POSIX stdlib stubs: fcntl.flock, os.O_DIRECTORY, signal.SIGHUP
# etc. exist there; the Windows stubs only add Windows-only noise.
platform = "linux"
follow_imports = "normal"
ignore_missing_imports = true
check_untyped_defs = false
# no-redef is disabled: the dual-mode import pattern (`try: from . import X
# except ImportError: import X`) intentionally assigns the same name twice so
# modules load both inside the installed package and with tools/ on sys.path
# (1,269 of the 1,587 baseline errors were this false positive).
disable_error_code = ["no-redef"]
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
show_error_codes = true
show_column_numbers = true
pretty = true
exclude = [
    "^\\.venv/",
    "^build/",
    "^dist/",
    "^\\.autocode/",
    "^\\.scenario-runs/",
    "^tools/dashboard/",
]
