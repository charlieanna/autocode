[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autocode-supervisor"
version = "0.7.1"
description = "Conversation-first Astra/Terra/Sol runner for Codex and OpenCode"
requires-python = ">=3.11"
readme = "README.md"
dependencies = ["psutil>=7.0,<8"]

[project.scripts]
autocode = "autocode_cli.autocode:cli"
autocode-dashboard = "autocode_cli.dashboard.agent_console:main"
autocode-ui = "autocode_cli.autocode_ui:cli"
autocode-tasks = "autocode_cli.autocode_tasks:cli"

[tool.setuptools]
packages = ["autocode_cli", "autocode_cli.dashboard"]
package-dir = {autocode_cli = "tools"}

[tool.setuptools.package-data]
autocode_cli = ["autocode-schemas/*.json", "autocode-schemas/v2/*.json"]
"autocode_cli.dashboard" = ["*.html", "*.css", "*.js"]
