# Implementation mutants for scenario 09.
# name | severity | what the bug is | the symptom an independent Validator must find
# Add a line to this file AND register the code block in scenario-09-mutation-validation.sh
# (the script owns the executable bodies; this file is the human-editable catalogue).
offbyone_empty    | high | total([]) returns 1 instead of 0        | empty-list / sum-default behavior
boundary_ge       | high | discount() uses >= instead of >         | boundary case at exactly 100
typeerror_swallow | high | bad input returns 0 instead of raising  | TypeError not raised
inverted_discount | high | discount() condition inverted           | discount applied to small orders
rounded_discount  | med  | discount() rounds to whole currency     | 90.9 becomes 91
negative_allowed  | med  | negative amounts accepted               | ValueError not raised
string_concat     | high | total() concatenates string prices      | type coercion instead of rejection
