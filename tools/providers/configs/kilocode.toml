name = "kilocode"
# kilo run prints OpenCode-format JSON events, so Autocode reads sessions, token
# usage, command exit codes and the final report from them. Kilo keeps its own
# logins: openai/... uses Kilo's ChatGPT OAuth connection, zhipuai-coding-plan/...
# uses its Zhipu AI Coding Plan connection and alibaba-token-plan/... its Alibaba
# Token Plan. kilo/... models bill the Kilo Gateway.
# Headless Kilo rejects permission requests without --auto. It answers ordinary
# asks once while retaining explicit denies in the selected native agent/config.
command = ["kilo", "run", "--auto", "--dir", "{workspace}", "--model", "{model}", "--variant", "{effort}", "--format", "json"]
prompt = "stdin"
output = "opencode_events"
resume = ["--session", "{session}"]
models_command = ["kilo", "models"]
version_command = ["kilo", "--version"]

[roles]
astra = { model = "openai/gpt-5.6-sol", effort = "high" }
terra = { model = "openai/gpt-5.6-terra", effort = "medium" }
sol = { model = "openai/gpt-5.6-sol", effort = "high" }
completion = { model = "openai/gpt-5.6-sol", effort = "medium" }
glm = { model = "zhipuai-coding-plan/glm-5.3", effort = "medium" }
plan_reviewer = { model = "openai/gpt-5.6-sol", effort = "high" }

[auth]
command = ["kilo", "auth", "list"]
forbid_env = ["OPENAI_API_KEY", "CODEX_API_KEY", "OPENAI_BASE_URL"]

[[auth.routes]]
models = "openai/"
pattern = "^\\s*[●•]\\s+OpenAI\\s+(\\S+)\\s*$"
expect = "oauth"

# The Alibaba Token Plan login serves alibaba-token-plan/... on the operator's own plan rather than
# billing the Kilo Gateway: Qwen (qwen3.8-max, qwen3.7-plus, qwen3.6-flash), and on the same login
# DeepSeek, GLM, Kimi and MiniMax, so a verifier can come from a different vendor than its producer.
[[auth.routes]]
models = "alibaba-token-plan/"
pattern = "^\\s*[●•]\\s+Alibaba Token Plan\\s+(\\S+)\\s*$"
expect = "api"

# The Zhipu AI Coding Plan login serves zhipuai-coding-plan/... (glm-5.3, glm-5.3-flash,
# glm-5.3-highspeed, glm-4.6v). kilo stopped publishing the older zai-coding-plan/ name, so
# the glm role default points here (#887) and the login is verified like the others (#888).
[[auth.routes]]
models = "zhipuai-coding-plan/"
pattern = "^\\s*[●•]\\s+Zhipu AI Coding Plan\\s+(\\S+)\\s*$"
expect = "api"
