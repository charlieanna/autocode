name = "codex"
label = "Codex"
# Codex on a ChatGPT login, for single stages of a run on another tool: `--role-transport tester=codex`
# puts the Tester on it, and a Claude Code or Gemini CLI run with Codex signed in hands it its checks by
# itself (autocode_second_vendor). A run on Codex alone keeps `--engine codex`; `--provider codex` is refused.
# `codex exec --json` prints Codex's own events; the report is Codex's last message, which `-o` saves.
# The codex_artifacts adapter fills {sandbox_args}: Codex's own sandbox, ignoring the user's config.toml, with a
# read-only stage allowed to write only .autocode/evidence and .autocode/output (docs/providers.md).
sandbox_adapter = "codex_artifacts"
command = ["codex", "exec", "--ephemeral", "{sandbox_args}", "-C", "{workspace}", "--model", "{model}", "-c", "model_reasoning_effort=\"{effort}\"", "-c", "approval_policy=\"never\"", "-c", "forced_login_method=\"chatgpt\"", "--output-schema", "{schema}", "-o", "{report}", "--json", "-"]
prompt = "stdin"
output = "report_file"
version_command = ["codex", "--version"]
models = ["gpt-5.6-terra", "gpt-5.6-sol", "gpt-6-astra"]

# The models and levels the Codex engine itself defaults to (autocode_stage_choices.CODEX_DEFAULTS).
[roles]
task_planner = { model = "gpt-5.6-sol", effort = "medium" }
builder = { model = "gpt-5.6-terra", effort = "medium" }
tester = { model = "gpt-5.6-sol", effort = "high" }
completion = { model = "gpt-5.6-sol", effort = "medium" }
planner = { model = "gpt-5.6-sol", effort = "medium" }
plan_reviewer = { model = "gpt-6-astra", effort = "high" }

# Codex bills the ChatGPT subscription only on a ChatGPT login; an API key in the environment would bill per token.
[auth]
command = ["codex", "login", "status"]
timeout_seconds = 30
forbid_env = ["OPENAI_API_KEY", "CODEX_API_KEY", "OPENAI_BASE_URL"]

[[auth.routes]]
models = "gpt-"
name = "ChatGPT"
billing = "subscription"
pattern = "(?m)^Logged in using (ChatGPT)\\b"
expect = "ChatGPT"
