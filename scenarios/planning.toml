# Planning stress corpus: build requests AutoPlanner plans, run only as far as the
# plan the user is asked to approve. `scenarios/run.py plan-compare` plans each one
# twice, with today's fixed pipeline and with --adaptive-planning, and compares the
# plans, the calls they took and the questions they asked (docs/adaptive-planning.md).
#
# Each case plans against a catalog scenario's seed. `brief` defaults to that
# scenario's brief.md. `expect` is what a good adaptive run should decide; the
# comparison reports it but does not fail on it. `[case.fake]` scripts what the
# scripted model says in fake mode, so every adaptive path runs offline:
#   clarity         the recognizer's answer (default "clear")
#   blocking_review 1 makes the first plan review blocking, so the revise path runs
#   requirements_rerun 1 makes the Planner send the feedback back to Requirements
#
# `feedback` is sent instead of approving the first plan; the run then goes on to the next
# plan shown for approval, and the comparison reports that feedback round separately. One
# case changes what is being built, so a Planner revising the plan should send it back to
# Requirements.

[[case]]
id = "tiny-greeting"
seed = "greenfield-greeting-cli"
feedback = "Also accept an optional --shout flag before the name that prints the greeting in upper case, exiting 0; everything else stays as planned."
expect = { clarity = "clear", size = "small" }

[[case]]
id = "small-json-flag"
seed = "feature-timesheet-by-project"
brief = "Add a --json option to `python3 -m timesheet report` that prints the same rows as a JSON array of objects with keys week and hours, instead of the text table. Without the option the output is unchanged. Add tests for both."
feedback = "In the JSON output, give hours as a number rounded to two decimals, not a string."
expect = { clarity = "clear", size = "small" }

[[case]]
id = "feature-by-project"
seed = "feature-timesheet-by-project"
feedback = "Also print a blank line between weeks in the --by-project output, before each new week after the first."
expect = { clarity = "clear", size = "small" }

[[case]]
id = "extend-record-query"
seed = "ladder-07-stable-record-query"
feedback = "Also allow sort_by=\"status\", compared as a case-sensitive string, with the same stability and missing-value rules as name."
expect = { clarity = "clear", size = "small" }
fake = { blocking_review = 1 }

