[[case]]
id = "deployment-planner"
seed = "ladder-24-deployment-config-plan"
feedback = "Also reject service names that contain whitespace, with ValueError."
expect = { clarity = "clear", size = "large" }

[[case]]
id = "diamond-four-milestones"
seed = "parallel-diamond"
feedback = "Also make check() include the node name it was called with in the string it returns."
expect = { clarity = "clear", size = "large" }
