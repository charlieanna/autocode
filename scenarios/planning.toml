id = "tenant-http-api"
seed = "ladder-16-tenant-http-api"
feedback = "Also add GET /health, which returns 200 with {\"ok\": true} and does not require the X-Tenant header."
expect = { clarity = "clear", size = "medium" }

[[case]]
id = "transactional-outbox"
