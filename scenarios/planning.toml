[[case]]
id = "vague-timesheet-useful"
seed = "feature-timesheet-by-project"
brief = "Project managers say the timesheet report is not very useful to them. Make it more useful for them."
feedback = "What they want most is hours per project for each week; keep the existing report output exactly as it is."
expect = { clarity = "vague" }
