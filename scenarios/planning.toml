[[case]]
id = "vague-refunds"
seed = "feature-refund-window"
brief = "Customers keep asking us for refunds and we handle them by hand. Add refund support to the shop."
feedback = "Also refuse any single refund of less than 100 cents, with the reason \"minimum refund is 100 cents\"."
expect = { clarity = "vague" }
fake = { clarity = "vague" }

[[case]]
id = "vague-reading-list"
seed = "greenfield-greeting-cli"
brief = "I want a little command-line tool to keep track of the books I am reading."
feedback = "Actually, make it a small local web page I open in the browser instead of a command-line tool."
expect = { clarity = "vague" }
fake = { clarity = "vague", blocking_review = 1, requirements_rerun = 1 }
