title = "A stronger Builder attempt projected past the person's milestone budget pauses before it launches"
category = "feature"
# Issue #611 (#1414): a climb consults the milestone budget the person set before it spends. The greeting repair is
# built under --max-milestone-seconds 100. The scripted run (fault "recovery_novelty_slow_build") is
# recovery-novelty's "fix" route: two Builder attempts fail the same blank-name check, then the Completion Owner's
# attested correction (the known-correction route) escalates the Builder to its stronger route. The second failing
# attempt holds its provider slot for 60 s (harness/recovery_novelty_provider.py), so the stronger attempt, projected
# from it, would take milestone M1 from under 100 s to past it: the run must pause PAUSED_MILESTONE_BUDGET before that
# attempt launches, naming the climb and the arithmetic. AutoCode times an attempt on its own clock, which a scripted
# provider cannot fake, so about a minute of the run is that wait.
#
# The person's acknowledgement below resumes with a 600 s budget, at least the total the stop names, as it advises;
# exactly that attempt should then launch and complete the repair. It also names the stronger model the stop shows:
# the driver repeats the run's starting flags on every call, --terra-model gpt-5.6-terra among them, which would
# otherwise move the climbed Builder back to its first model.

[run]
expected = "complete"
requires_stages = ["terra", "sol", "astra_review"]
timeout_minutes = 10
max_steps = 30
known_failure = "the advised resume does not make the attempt: --max-milestone-seconds changes settings that the known-correction repair's recovery packet binds (autocode_resolver_recovery._binding hashes the milestone budget, unlike --max-seconds and --max-cost-usd), so the stronger attempt stops at PAUSED_STALE_HANDOFF"

[fake]
check = "python3 -m unittest test_greet.py"
fault = "recovery_novelty_slow_build"
flags = ["--max-milestone-seconds", "100"]
acknowledge = { PAUSED_MILESTONE_BUDGET = ["--max-milestone-seconds", "600", "--terra-model", "gpt-6-sol"] }
