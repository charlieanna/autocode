title = "A three-workstream program: walking skeleton, two parallel extensions, an interface change"
category = "program"
# Issues #22 and #23 end to end, through `autocode program` (scenarios/README.md, "Programs"):
# a plan run planned and approved, `program derive`, the agreement shown and approved by its
# exact token, then `program run` until the program completes. Each workstream is an ordinary
# AutoCode run in its own worktree, linked to the agreement. The walking skeleton S is merged
# and verified first; T and U then run in parallel and every merge re-runs the cumulative
# checks; the integration workstream delivers tests/test_journey.py and verifies journey capture-and-find by
# name. Once S has merged, T raises a change request on the store interface; the person
# publishes version 2, so S (merged) and T and U (waiting for plan approval) lose their
# approval and are planned, approved and checked again. S's files already conform, so its
# re-check validates without changes. That validate-only plan is the scripted model's choice
# (harness/fake_codex.py, milestone_task): a re-check planned as an implementation of a
# workstream that already conforms stalls the program, since its Builder has nothing to change
# (docs/bugs/2026-10-06-program-recheck-implement-stall.md).
#
# [program] revise and [[program.change]] name workstreams by the [fake] milestones ids below.
# A live planner picks its own ids, so the driver maps each to the derived workstream that owns
# that milestone's paths (scenarios/README.md, "Programs"); under the fake the ids are the same.
#
# broken/search-shadows-list: T's own test passes, but T registers `list` as a search, which
# breaks the skeleton's journey: the cumulative checks undo T's merge (PAUSED_INTEGRATION_CHECK).
# broken/case-sensitive-search: every delivered test passes and the program completes; only the
# hidden journey test catches the case-sensitive search (FALSE_COMPLETE).

[program]
max_parallel = 2

# The person's own edits to the derived manifest before they first approve it.
[program.revise.shared]
interfaces = [{ id = "store", summary = "notes/store.py: load() returns the notes as {id, text}; add(text) appends one and returns it", paths = ["notes/store.py"], version = 1, producer = "S", consumers = ["T", "U"] }]

[[program.revise.journeys]]
# A planner names its own requirement ids (a live one used J1 and J2), and journey ids must differ from them.
id = "capture-and-find"
name = "Capture and find a note"
steps = ["Add notes with python3 -m notes add TEXT", "List them with python3 -m notes list",
         "Find one with python3 -m notes search WORDS, ignoring case", "Export them with python3 -m notes export"]

[[program.change]]
after = "merged:S"
interface = "store"
by = "T"
reason = "search reads every note through load(), and the interface does not promise the order the notes come back in"
decide = "accept"
publish = { version = 2, summary = "notes/store.py: load() returns the notes as {id, text} in the order they were added; add(text) appends one and returns it" }

[run]
max_steps = 60
timeout_minutes = 20

[fake]
check = "python3 -m unittest discover -s tests -t ."

[[fake.milestones]]
id = "S"
depends_on = []
paths = ["notes/__init__.py", "notes/__main__.py", "notes/cli.py", "notes/store.py", "notes/commands/__init__.py",
         "tests/test_skeleton.py"]
objective = "Walking skeleton: python3 -m notes add and list, kept in the note store, with tests/test_skeleton.py walking add then list"
verify = "python3 -m unittest tests.test_skeleton"

[[fake.milestones]]
id = "T"
depends_on = ["S"]
paths = ["notes/commands/search.py", "tests/test_search.py"]
objective = "Search: notes/commands/search.py registers search WORDS, ignoring case, with tests/test_search.py"
verify = "python3 -m unittest tests.test_search"

[[fake.milestones]]
id = "U"
depends_on = ["S"]
paths = ["notes/commands/export.py", "tests/test_export.py"]
objective = "Export: notes/commands/export.py registers export, a JSON array of id and text, with tests/test_export.py"
verify = "python3 -m unittest tests.test_export"
