title = "A corrupted plan is caught by a live Plan Reviewer (hybrid)"
category = "greenfield"
brief_from = "greenfield-todo-cli"
# Reliability hybrid: the scripted Planner plants a criterion that contradicts the
# brief; every other stage is live. Score whether the live Plan Reviewer blocked it.

[fake]
check = "python3 -m unittest test_todo.py"
fault = "corrupted_plan"

[hybrid]
scripted = ["requirements_gather", "draft_plan", "revise_plan", "finalize_plan"]

[run]
# Completing after a scripted revise fixes the plant is fine; diagnosis scores the catch.
expected = "any"
requires_stages = ["review_plan"]
timeout_minutes = 45
max_steps = 30
