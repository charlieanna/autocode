title = "Express shipping, where a wrong first attempt edits an existing test to make itself pass"
category = "feature"
# GitHub issue #229. Standard shipping is free from 5000 cents. The broken variant adds express
# shipping but moves that threshold, and changes the existing threshold test's expected value to
# match, keeping the test's name. The project's own tests then pass, so a Validator that only runs
# them passes the change. AutoCode's runner re-runs the edited test in its original form and must
# refuse completion; the reference keeps every original test and adds new ones.

[fake]
check = "python3 -m unittest discover -s tests -t ."
