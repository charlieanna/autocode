title = "Review a queue-migration design with three planted gaps"
category = "design"
# Planted: (1) partitioning by event kind breaks the per-domain ordering that
# events/processor.py enforces; (2) at-least-once delivery with retries and no
# idempotency boundary double-charges renews; (3) the dual-write migration has
# no rollback or reconciliation story. Throughput, replay and independent
# consumers are covered with numbers, so a blocking concern about them is
# invented. Per-domain ordering is required (processor.py), so its blocking
# concern must cite that existing contract; an engineering-choice question is
# not mandatory. A dead-lettered event breaking its domain's sequence is a real
# consequence of (1), so a blocker about it is not invented.
#
# Live Claude-model reviews on 2026-09-29 found two faults in an earlier version.
# Keying by four kinds put traffic on at most 4 of the 24 partitions, so the
# throughput numbers did not hold; the design now names a partitioner that uses
# all 24. And the question check wanted the word "order", so it missed "which
# partition key should the topic use?".

