title = "Refusal tests that also pass on the original code reach AutoResolver"
category = "feature"
# Issue #59: does AutoResolver diagnose a real failure correctly? The failure is natural, not
# scripted: on the original code `stock.py move` is an unknown subcommand, so argparse exits 2 and
# never touches stock.json. A refusal test that asserts only exit 2, some stderr and unchanged bytes
# passes there too, and the runner's model-free regression proof rejects it ("Test case Cn ... did
# not pass without it", the test listed under pass_to_pass).
#
# Deliberate nudge, disclosed: the seed's only refusal test is written in exactly that style, so a
# Builder that follows the seed's tests writes vacuous refusal tests. The product code is easy.
#
# Routing basis: a Completion REWORK goes straight back to the Builder (#294, autocode_rework_policy)
# only after a Validator FAIL backed by an executed failing check whose receipt is in the run's own
# evidence. Here the project's tests pass, and on the claude provider check receipts are
# workspace-shared captures, which also need AutoResolver. The 2026-10-04 claude-tiers runs of
# greenfield-todo-cli reached astra_resolve the same way, on usage-error tests that passed without
# todo.py.
#
# oracle.py's check() judges the product only. Its diagnosis() scores the first accepted Resolver call
# at the failed proof's revision against the proof's own record, apart from the run verdict
# (scenarios/README.md, "Diagnosis").

[fake]
check = "python3 -m unittest discover -s tests -t ."
fault = "vacuous_refusal_tests"

[run]
requires_stages = ["astra_resolve"]
timeout_minutes = 60
max_steps = 30
