name: documentation

on:
  pull_request:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r docs/requirements.txt
      - name: Build site and check internal links
        run: mkdocs build --strict
        env:
          DOCS_SOURCE_REF: ${{ github.sha }}

  publish:
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    concurrency:
      group: documentation-publication
      queue: max
      cancel-in-progress: false
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r docs/requirements.txt
      - name: Publish latest only from current master
        id: current
        env:
          DOCS_SOURCE_REF: ${{ github.sha }}
          DOCS_REF_TYPE: ${{ github.ref_type }}
        run: |
          current_master=$(git ls-remote origin refs/heads/master | cut -f 1)
          if [ "$DOCS_REF_TYPE" = branch ] && [ "$current_master" != "$DOCS_SOURCE_REF" ]; then
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            echo 'Skipping an older master build; latest belongs to current master.'
          else
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Preserve previous versions and build this version
        if: steps.current.outputs.publish == 'true'
        env:
          DOCS_SOURCE_REF: ${{ github.sha }}
          DOCS_REF_TYPE: ${{ github.ref_type }}
          DOCS_REF_NAME: ${{ github.ref_name }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if [ "$DOCS_REF_TYPE" = branch ]; then
            mike deploy --push latest
            mike set-default --push latest
          else
            mike deploy --push "$DOCS_REF_NAME"
          fi
          mkdir _pages
          git archive gh-pages | tar -x -C _pages
      - uses: actions/configure-pages@v5
        if: steps.current.outputs.publish == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.current.outputs.publish == 'true'
        with:
          path: _pages
      - name: Publish GitHub Pages
        id: deployment
        if: steps.current.outputs.publish == 'true'
        uses: actions/deploy-pages@v4
