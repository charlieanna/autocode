name: publish

# Publishes the autocode-supervisor distribution to PyPI when a version tag (v0.7.1)
# is pushed. PyPI trusted publishing (OIDC): PyPI trusts this repository, this
# workflow file and the "pypi" environment, so no API token is stored anywhere.
# One-time setup and the release steps: docs/releasing.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check the tag names pyproject's version
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match pyproject.toml version $version (expected v$version)"
            exit 1
          fi

      - name: Build the sdist and wheel
        run: |
          python3 -m pip install build
          python3 -m build

      - name: Check the wheel installs and reports the tag's version
        working-directory: ${{ runner.temp }}
        run: |
          python3 -m venv smoke
          smoke/bin/pip install "$GITHUB_WORKSPACE"/dist/*.whl
          smoke/bin/autocode --version | tee version.txt
          grep -q "^autocode ${GITHUB_REF_NAME#v} " version.txt

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/autocode-supervisor
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
