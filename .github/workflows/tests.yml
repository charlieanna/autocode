name: tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  suite:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install runtime dependency
        run: python3 -m pip install "psutil>=7.0,<8"

      - name: Run the suite gate
        # tools/run_suite.py wraps the same discovery as
        # `python -m unittest discover -s tools -t . -p 'test_*.py'`, minus
        # the modules documented in tools/suite_exclusions.json (each with a
        # recorded reason). It fails if any non-excluded test fails, and
        # separately fails if an exclusion entry no longer matches anything
        # discovered, so a stale exclusion cannot mask real coverage.
        run: python3 tools/run_suite.py --verbosity 2
        env:
          PYTHONDONTWRITEBYTECODE: "1"
