name: tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  # Superseded runs of a non-master ref stop burning a full suite: rapid PR pushes
  # otherwise stack 45+ minute runs that no decision waits on (2026-10-10: five were
  # in flight at once). Master is different — its run is the integrated-tree verdict
  # every merge decision leans on, and with merge cadence (~10 min) below suite
  # duration (30-48 min) cancelling the in-flight run meant no master commit ever
  # delivered one (2026-10-11: five merge commits in a row, zero verdicts; #1048).
  # Master runs queue instead: a newer run supersedes only a pending run, never the
  # running one, so each window delivers a verdict and the queue drains to the
  # newest commit.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      suite: ${{ steps.select.outputs.suite }}
      scenarios: ${{ steps.select.outputs.scenarios }}
      dashboard: ${{ steps.select.outputs.dashboard }}
      extension: ${{ steps.select.outputs.extension }}
      visual: ${{ steps.select.outputs.visual }}
      containers: ${{ steps.select.outputs.containers }}
      macos: ${{ steps.select.outputs.macos }}
      linux: ${{ steps.select.outputs.linux }}
      windows: ${{ steps.select.outputs.windows }}
      wheel: ${{ steps.select.outputs.wheel }}
      docs: ${{ steps.select.outputs.docs }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Select affected checks
        id: select
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            python tools/ci_scope.py --base "$BASE" --head "$HEAD" --github-output "$GITHUB_OUTPUT"
          else
            python tools/ci_scope.py --full --github-output "$GITHUB_OUTPUT"
          fi

  extension:
    needs: scope
    if: needs.scope.outputs.extension == 'true'
    # The VS Code client (#884) is TypeScript over the CLI, so its gate is Node, not
    # the Python suite. It reads only `--status` and `registry list --json`, so this
    # job needs no provider and spends no model allowance.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install the client's dependencies
        run: npm ci
        working-directory: vscode-extension
      - name: Typecheck
        run: npm run typecheck
        working-directory: vscode-extension
      - name: Test the CLI contract, editor commands and webview
        run: npm test
        working-directory: vscode-extension
      - name: Bundle
        run: npm run build
        working-directory: vscode-extension
      - name: Package the distributable
        run: npm run package -- --out /tmp/autocode.vsix
        working-directory: vscode-extension

  suite:
    needs: scope
    if: needs.scope.outputs.suite == 'true' || needs.scope.outputs.scenarios == 'true' || needs.scope.outputs.dashboard == 'true'
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu only since 2026-10-03: on GitHub's macOS runners the scenario harness took
        # 19 minutes against 4 on Ubuntu (each loopback request through the phase guard
        # stalled about 36 s there, not on a local Mac). Native Seatbelt checks run
        # separately in macos-tool-containment below.
        # Keep the existing one-entry matrix/check name: "suite (ubuntu-latest)".
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, not the default shallow (depth-1) clone:
          # tests.test_catalogue_t14.SystematicCase.test_sys07_saved_failing_trace_replays
          # reads a specific historical commit (`git show <sha>:tools/autocode_support.py`)
          # to replay a saved regression, and a shallow clone doesn't have it.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        if: needs.scope.outputs.dashboard == 'true' || needs.scope.outputs.scenarios == 'true'
        with:
          node-version: "22"

      - uses: actions/setup-go@v5
        if: needs.scope.outputs.scenarios == 'true'
        with:
          go-version: "1.25.5"
          cache: false

      - uses: actions/setup-java@v4
        if: needs.scope.outputs.scenarios == 'true'
        with:
          distribution: temurin
          java-version: '17.0.16+8'

      - name: Install dashboard browser test dependencies
        if: needs.scope.outputs.dashboard == 'true'
        # AC15 runs a real browser from the Python suite, before the Node gate.
        # Pin the version used for the local feature acceptance checks.
        run: |
          # The Azure mirror can stall on the 61 MB CJK font archive before any tests run.
          # Keep signed Ubuntu packages and use the official archive over HTTPS.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
          npm install --global agent-browser@0.25.3
          agent-browser install --with-deps

      - name: Prepare native Linux verification boundary
        if: runner.os == 'Linux' && needs.scope.outputs.suite == 'true'
        # Native readonly verification is exercised by the suite, so it needs
        # the same kernel backend as linux-tool-containment on this disposable VM.
        run: |
          sudo apt-get update -q
          # tmux: tests.test_chat_screens drives the full-screen chat in a real terminal (#1646).
          sudo apt-get install -y -q bubblewrap libseccomp2 tmux
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          /usr/bin/bwrap --unshare-all --ro-bind / / --dev /dev --proc /proc -- /bin/true

      - name: Install package and runtime dependencies
        # Evidence-bound reuse requires an isolated, source-bound editable install.
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -e '.[visual,test]'

      - name: Verify privileged Linux CLI startup
        if: runner.os == 'Linux' && needs.scope.outputs.suite == 'true'
        run: |
          sudo env AUTOCODE_TEST_PRIVILEGED_STARTUP=1 .venv/bin/python -m unittest tests.test_capability_startup.LinuxCapabilityStartupTests tests.test_demo

      - name: Prepare pinned Java scenario dependencies
        if: needs.scope.outputs.scenarios == 'true'
        run: |
          .venv/bin/python scenarios/harness/java_toolchain.py --root .scenario-runs/issue-696-java-toolchain
          echo "$PWD/.scenario-runs/issue-696-java-toolchain/bin" >> "$GITHUB_PATH"

      - name: Run the suite gate
        if: needs.scope.outputs.suite == 'true'
        # tools/run_suite.py wraps the same discovery as
        # `python -m unittest discover -s tests -t . -p 'test_*.py'`, minus
        # the modules documented in tests/suite_exclusions.json (each with a
        # recorded reason). It fails if any non-excluded test fails, and
        # separately fails if an exclusion entry no longer matches anything
        # discovered, so a stale exclusion cannot mask real coverage.
        # Pull requests select affected modules against the event's immutable base;
        # ci_scope.py also selects relevant CLI/scenario and native boundary jobs.
        # Master and manual runs retain the complete suite, including slow modules.
        # Test modules run side by side, one per CPU.
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            .venv/bin/python tools/run_suite.py --verbosity 2 --changed "$BASE"
          else
            .venv/bin/python tools/run_suite.py --verbosity 2
          fi

      - name: Run the scenario harness
        if: needs.scope.outputs.scenarios == 'true'
        # scenarios/ is outside tests/: its catalog checks and scripted end-to-end runs
        # (scenarios/README.md) would otherwise never run in CI. Each test runs in its own
        # interpreter, one per CPU at a time; run serially the harness alone took about
        # 3.5 minutes. The other scenarios/test_*.py modules (adversarial attacks, native
        # runs) run here too: until #1088 nothing ran them, and they drifted. A pull request
        # leaves out the slow ones in tests/suite_slow.json unless it changes scenarios/ or
        # the suite machinery; master runs them all.
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            .venv/bin/python tools/run_suite.py --scenario-harness --verbosity 2 --changed "$BASE"
          else
            .venv/bin/python tools/run_suite.py --scenario-harness --verbosity 2
          fi
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          PYTHONDONTWRITEBYTECODE: "1"

      - name: Run the dashboard suite
        if: needs.scope.outputs.dashboard == 'true'
        # tools/dashboard/tests is outside tests/, so run_suite.py never
        # discovers it; run it here so it can't drift unnoticed again (#94).
        run: .venv/bin/python -m unittest discover -s tools/dashboard/tests -p 'test_*.py' -v
        env:
          PYTHONDONTWRITEBYTECODE: "1"

      - name: Verify chat, answers, Work, preview and recovery in real browsers
        if: needs.scope.outputs.dashboard == 'true'
        # Read-only messages and exact-message confirmation must remain safe
        # with a pending question, after reload, and at narrow viewports.
        run: |
          .venv/bin/python - <<'PYTHON'
          import json, os, sys, tempfile
          from pathlib import Path
          from tests.browser_suite_process import run
          with tempfile.TemporaryDirectory(prefix="ab-", dir="/tmp") as sockets:
              env = {**os.environ, "AGENT_BROWSER_SOCKET_DIR": sockets,
                     "AUTOCODE_TEST_PYTHON": sys.executable}
              for script, cap in [("test_chat_intent_browser_ui.js", 180),
                                  ("test_work_summary_browser_ui.js", 240),
                                  ("test_question_cards_browser_ui.js", 240),
                                  ("test_cross_pane_links_browser_ui.js", 240),
                                  ("test_preview_browser_ui.js", 240),
                                  ("test_recovery_browser_ui.js", 300),
                                  ("test_draft_cadence_browser_ui.js", 300),
                                  ("test_delete_browser_ui.js", 300),
                                  ("test_setup_browser_ui.js", 300),
                                  ("test_checkpoint_browser_ui.js", 300),
                                  ("test_criterion_diff_browser_ui.js", 240),
                                  # #730 acceptance: a scenario's brief in chat through a real fake-provider build.
                                  ("test_scenario_client_browser_ui.js", 600),
                                  ("test_preview_dev_server_browser_ui.js", 300),
                                  ("test_scoped_start_browser_ui.js", 240)]:
                  try:
                      result = run(["node", "tools/dashboard/tests/" + script],
                                   cwd=Path.cwd(), env=env, timeout=cap)
                  except BaseException as error:
                      print(json.dumps(getattr(error, "receipt", {"error": str(error)})))
                      raise
                  print(json.dumps(result.receipt))
                  if result.returncode:
                      sys.exit(result.returncode)
          PYTHON

      - name: Run the dashboard Node tests
        if: needs.scope.outputs.dashboard == 'true'
        # Browser checks invoked by Python tests run in the suite above.
        # Standalone browser matrices remain part of local visual acceptance;
        # the log names those omitted from this separate Node gate.
        run: |
          for test_file in tools/dashboard/tests/test_*.js; do
            if grep -q "agent-browser" "$test_file"; then
              echo "Standalone browser matrix (verified separately): $test_file"
              continue
            fi
            echo "node $test_file"
            node "$test_file" || exit 1
          done

  macos-tool-containment:
    needs: scope
    if: needs.scope.outputs.macos == 'true'
    # Target the real shell/Seatbelt boundary, without the slow macOS scenario suite
    # or the opt-in NativeToolTests that require a pinned OpenCode installation.
    # Native readonly checks are admitted only here (macOS Seatbelt and the Command Line
    # Tools Git), so their gated tests run in this job; the suite job skips them on Linux.
    runs-on: macos-15
    # Raised from 10: the native check classes add about 70 supervised Seatbelt launches
    # (five Git setup commands and one check per native run), and the owner-loss test alone
    # may wait up to 5 minutes for readiness, so a slow or failing run still reports.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and runtime dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -e .
      - name: Require native Seatbelt enforcement without skipped tests
        run: |
          .venv/bin/python - <<'PYTHON'
          import os
          import sys
          import unittest
          from pathlib import Path

          sandbox = Path("/usr/bin/sandbox-exec")
          if sys.platform != "darwin" or not sandbox.is_file() or not os.access(sandbox, os.X_OK):
              raise SystemExit("Native containment CI requires macOS and executable /usr/bin/sandbox-exec")

          names = (
              "tests.test_tool_containment.UnicodeKernelTests",
              "tests.test_tool_containment.KernelTests",
              # Every class with a test gated on requires_native_check_host.
              "tests.test_native_check_execution.NativeCheckExecutionTests",
              "tests.test_native_check_execution.FixedNativeGitSetupFactsTests",
              "tests.test_native_check_execution.NativeCheckDeadlineTests",
              "tests.test_native_check_execution.NativeCheckOwnerLossTests",
              "tests.test_native_initial_callers.OriginalCheckFailureTests",
          )
          suite = unittest.TestSuite()
          for name in names:
              selected = unittest.defaultTestLoader.loadTestsFromName(name)
              if selected.countTestCases() == 0:
                  raise SystemExit(f"Native containment selection is empty: {name}")
              suite.addTests(selected)
          loaded = suite.countTestCases()
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if result.testsRun != loaded or result.skipped or result.expectedFailures or not result.wasSuccessful():
              raise SystemExit("Native containment CI requires every selected test to execute and pass without skips")
          PYTHON
        env:
          PYTHONDONTWRITEBYTECODE: "1"

  linux-tool-containment:
    needs: scope
    if: needs.scope.outputs.linux == 'true'
    # The Linux bubblewrap boundary (#709), as macos-tool-containment checks Seatbelt: the
    # kernel controls must run, not skip. Ubuntu restricts unprivileged user namespaces
    # through AppArmor; a runner is a throwaway VM, so the job lifts that restriction.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install bubblewrap and allow unprivileged user namespaces
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q bubblewrap libseccomp2 python3-venv
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          /usr/bin/bwrap --version
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.5"
          cache: false
      - name: Install package and runtime dependencies
        # The distribution's Python: its runtime is under /usr, which the boundary mounts.
        run: |
          /usr/bin/python3 -m venv .venv
          .venv/bin/python -m pip install -e .
      - name: Require native bubblewrap enforcement without skipped tests
        run: |
          .venv/bin/python - <<'PYTHON'
          import sys
          import unittest

          sys.path.insert(0, "tools")
          import autocode_tool_containment as containment

          problem = containment.sandbox_problem()
          if containment.backend() != containment.BUBBLEWRAP or problem:
              raise SystemExit(f"Native containment CI requires a working Linux bubblewrap: {problem}")

          names = (
              "tests.test_tool_containment.UnicodeKernelTests",
              "tests.test_tool_containment.KernelTests",
              "tests.test_tool_containment.BubblewrapKernelTests",
              "tests.test_toolchain.SelectedToolchainTests",
              "tests.test_elf_dependencies.LoaderFixtureTests",
              "tests.test_native_linux_boundary.NativeLinuxKernelTests",
              "tests.test_native_linux_check.NativeLinuxCheckTests",
              "tests.test_native_check_execution.NativeCheckExecutionTests",
              "tests.test_native_check_execution.FixedNativeGitSetupFactsTests",
              "tests.test_native_check_execution.NativeCheckDeadlineTests",
              "tests.test_native_check_execution.NativeCheckOwnerLossTests",
              "tests.test_native_initial_callers.OriginalCheckFailureTests",
              "tests.test_kilo_linux_boundary.KiloLinuxBoundaryTests.test_pure_allows_threads_but_denies_process_fork_and_network",
              "tests.test_kilo_linux_boundary.KiloLinuxBoundaryTests.test_unix_relay_is_reachable_while_foreign_socket_and_host_network_are_absent",
              "tests.test_kilo_linux_boundary.KiloLinuxBoundaryTests.test_original_namespace_pid1_is_bound_but_its_forked_peer_is_refused",
              "tests.test_kilo_linux_boundary.KiloLinuxBoundaryTests.test_policy_filter_and_command_tampering_refuse",
              # A fake OpenCode run through the CLI whose Builder, Tester and Completion Reviewer launch
              # contained, and the uncontained control for its planted write outside the workspace.
              "tests.test_contained_fake_cli.ContainedFakeOpenCodeFlow",
              # The dashboard suite job has no bubblewrap and skips this one (#1250). Last: its module
              # puts tools/dashboard first on sys.path.
              "dashboard.tests.test_permanent_delete_endpoints.PermanentDeleteTests"
              ".test_managed_worktree_can_be_deleted_after_a_native_planning_boundary",
          )
          suite = unittest.TestSuite()
          for name in names:
              selected = unittest.defaultTestLoader.loadTestsFromName(name)
              if selected.countTestCases() == 0:
                  raise SystemExit(f"Native containment selection is empty: {name}")
              suite.addTests(selected)
          loaded = suite.countTestCases()
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if result.testsRun != loaded or result.skipped or result.expectedFailures or not result.wasSuccessful():
              raise SystemExit("Native containment CI requires every selected test to execute and pass without skips")
          PYTHON
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          AUTOCODE_NATIVE_LINUX_BOUNDARY_TEST: "1"

  windows-fast-suite:
    needs: scope
    if: needs.scope.outputs.windows == 'true'
    # Native Windows progress report (#698), not a gate yet. Every step that can fail is
    # continue-on-error and the job is too, so this job can never fail the workflow or
    # turn master red; read the outcome in the job summary. docs/windows.md lists what
    # is known not to work natively. Make it required (drop continue-on-error) once green.
    runs-on: windows-latest
    continue-on-error: true
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and runtime dependencies
        id: install
        continue-on-error: true
        run: |
          python -m venv .venv
          .venv/Scripts/python -m pip install -e .
      - name: Run autocode --version and doctor
        id: doctor
        continue-on-error: true
        # The CLI imports the whole runtime, so this fails first on a POSIX-only import
        # (tests/test_windows_portability.py lists them). No engine is installed here, so
        # doctor exits 1: accept 0 or 1, as wheel-smoke does.
        run: |
          .venv/Scripts/autocode --version
          code=0
          .venv/Scripts/autocode doctor --json || code=$?
          [ "$code" -le 1 ] || { echo "::warning::autocode doctor exited $code on Windows"; exit 1; }
      - name: Run the fast suite
        id: suite
        continue-on-error: true
        timeout-minutes: 45
        # Every fast module: --changed against HEAD selects nothing extra, --all-fast adds the rest.
        # A module still running after 10 minutes is ended and named as timed out (#1681), so one
        # hung module cannot run into the step limit and hide which one it was.
        run: .venv/Scripts/python tools/run_suite.py --verbosity 2 --changed HEAD --all-fast --module-timeout 600
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONUTF8: "1"
      - name: Summarize native Windows results
        if: ${{ always() }}
        run: |
          {
            echo "### Native Windows (#698, allowed to fail)"
            echo "- install: ${{ steps.install.outcome }}"
            echo "- doctor: ${{ steps.doctor.outcome }}"
            echo "- fast suite: ${{ steps.suite.outcome }}"
          } >> "$GITHUB_STEP_SUMMARY"

  wheel-smoke:
    needs: scope
    if: needs.scope.outputs.wheel == 'true'
    # The installed package, not the checkout (#67): build the wheel, install it into a
    # fresh venv, and run it from a folder outside any Git repository. A separate job,
    # so the suite above does not wait for it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build the wheel and install it into a fresh venv
        run: |
          python3 -m pip wheel --no-deps --wheel-dir "$RUNNER_TEMP/dist" .
          python3 -m venv "$RUNNER_TEMP/smoke"
          "$RUNNER_TEMP/smoke/bin/pip" install "$RUNNER_TEMP"/dist/*.whl
      - name: Run --version and doctor outside any repository
        # No engine is installed here, so doctor exits 1: check its JSON, not exit 0.
        run: |
          cd "$(mktemp -d)"
          if git rev-parse --git-dir >/dev/null 2>&1; then echo "::error::$PWD is inside a Git repository"; exit 1; fi
          "$RUNNER_TEMP/smoke/bin/autocode" --version | tee version.txt
          grep -q "(commit unknown)" version.txt
          code=0
          "$RUNNER_TEMP/smoke/bin/autocode" doctor --json > doctor.json || code=$?
          cat doctor.json
          [ "$code" -le 1 ] || { echo "::error::doctor exited $code"; exit 1; }
          python3 - doctor.json <<'PYTHON'
          import json, sys
          report = json.load(open(sys.argv[1]))
          checks = {check["name"]: check["status"] for check in report["checks"]}
          expected = {"python", "psutil", "git", "engine:opencode", "engine:codex", "engine", "workspace"}
          assert expected <= set(checks), sorted(expected - set(checks))
          assert all(checks[name] == "ok" for name in ("python", "psutil", "git")), checks
          assert checks["workspace"] == "missing" and report["ok"] is False, report
          PYTHON
      - name: Check installed provider-matrix rows outside the checkout
        run: |
          cd "$(mktemp -d)"
          "$RUNNER_TEMP/smoke/bin/python" -I "$GITHUB_WORKSPACE/tests/installed_provider_matrix.py" -v
      - name: Explain saved runs with the installed CLI without provider dispatch
        run: |
          cd "$(mktemp -d)"
          "$RUNNER_TEMP/smoke/bin/python" -I "$GITHUB_WORKSPACE/tests/installed_cli_explain.py" -v
      - name: Bind installed prompt resources to the reviewed source
        run: |
          cd "$(mktemp -d)"
          "$RUNNER_TEMP/smoke/bin/python" -I "$GITHUB_WORKSPACE/tests/installed_prompt_resources.py"

  visual-comparison:
    needs: scope
    if: needs.scope.outputs.visual == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install image and browser test dependencies
        run: |
          python3 -m pip install -e '.[visual-test]'
          python3 -m playwright install --with-deps chromium
      - name: Run real-browser visual comparison controls
        run: python3 -m unittest tests.test_visual_check_browser -v
        env:
          AUTOCODE_REQUIRE_VISUAL_BROWSER: "1"
          PYTHONDONTWRITEBYTECODE: "1"

  lint:
    needs: scope
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        id: lint-install
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -e '.[visual]'
          .venv/bin/python -m pip install -r requirements-lint.txt
      - name: Ruff lint
        if: ${{ !cancelled() && steps.lint-install.outcome == 'success' }}
        run: .venv/bin/ruff check tools/ tests/ scenarios/
      - name: Ruff format check
        if: ${{ !cancelled() && steps.lint-install.outcome == 'success' }}
        run: .venv/bin/ruff format --check tools/ tests/ scenarios/
      - name: Mypy type check
        if: ${{ !cancelled() && steps.lint-install.outcome == 'success' }}
        run: .venv/bin/mypy tools/

  ci-required:
    # One stable required check: a skipped unrelated job is expected, while a
    # failed scope selection or a selected job that fails/cancels cannot pass.
    needs: [scope, suite, extension, macos-tool-containment, linux-tool-containment, windows-fast-suite, wheel-smoke, visual-comparison, lint]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every selected check
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          import sys

          needs = json.loads(os.environ["NEEDS"])
          if needs["scope"]["result"] != "success":
              sys.exit("CI scope selection did not pass")
          scope = needs["scope"]["outputs"]
          flags = ("suite", "scenarios", "dashboard", "extension", "visual", "containers",
                   "macos", "linux", "windows", "wheel", "docs")
          if any(scope.get(flag) not in ("true", "false") for flag in flags):
              sys.exit("CI scope selection returned incomplete outputs")
          selected = {
              "suite": any(scope[flag] == "true" for flag in ("suite", "scenarios", "dashboard")),
              "extension": scope["extension"] == "true",
              "macos-tool-containment": scope["macos"] == "true",
              "linux-tool-containment": scope["linux"] == "true",
              "windows-fast-suite": scope["windows"] == "true",
              "wheel-smoke": scope["wheel"] == "true",
              "visual-comparison": scope["visual"] == "true",
              "lint": True,
          }
          failures = []
          for job, required in selected.items():
              expected = "success" if required else "skipped"
              actual = needs[job]["result"]
              print(f"{job}: {actual} (expected {expected})")
              if actual != expected:
                  failures.append(job)
          if failures:
              sys.exit("Selected CI checks did not pass: " + ", ".join(failures))
          PYTHON
