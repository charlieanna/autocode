name: tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  # Superseded runs of a non-master ref stop burning a full suite: rapid PR pushes
  # otherwise stack 45+ minute runs that no decision waits on (2026-10-10: five were
  # in flight at once). Master is different — its run is the integrated-tree verdict
  # every merge decision leans on, and with merge cadence (~10 min) below suite
  # duration (30-48 min) cancelling the in-flight run meant no master commit ever
  # delivered one (2026-10-11: five merge commits in a row, zero verdicts; #1048).
  # Master runs queue instead: a newer run supersedes only a pending run, never the
  # running one, so each window delivers a verdict and the queue drains to the
  # newest commit.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  suite:
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu only since 2026-10-03: on GitHub's macOS runners the scenario harness took
        # 19 minutes against 4 on Ubuntu (each loopback request through the phase guard
        # stalled about 36 s there, not on a local Mac). Native Seatbelt checks run
        # separately in macos-tool-containment below.
        # Keep the existing one-entry matrix/check name: "suite (ubuntu-latest)".
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, not the default shallow (depth-1) clone:
          # tests.test_catalogue_t14.SystematicCase.test_sys07_saved_failing_trace_replays
          # reads a specific historical commit (`git show <sha>:tools/autocode_support.py`)
          # to replay a saved regression, and a shallow clone doesn't have it.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.5"
          cache: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17.0.16+8'

      - name: Install dashboard browser test dependencies
        # AC15 runs a real browser from the Python suite, before the Node gate.
        # Pin the version used for the local feature acceptance checks.
        run: |
          npm install --global agent-browser@0.25.3
          agent-browser install --with-deps

      - name: Install package and runtime dependencies
        # Evidence-bound reuse requires an isolated, source-bound editable install.
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -e '.[visual]'

      - name: Prepare pinned Java scenario dependencies
        run: |
          .venv/bin/python scenarios/harness/java_toolchain.py --root .scenario-runs/issue-696-java-toolchain
          echo "$PWD/.scenario-runs/issue-696-java-toolchain/bin" >> "$GITHUB_PATH"

      - name: Run the suite gate
        # tools/run_suite.py wraps the same discovery as
        # `python -m unittest discover -s tests -t . -p 'test_*.py'`, minus
        # the modules documented in tests/suite_exclusions.json (each with a
        # recorded reason). It fails if any non-excluded test fails, and
        # separately fails if an exclusion entry no longer matches anything
        # discovered, so a stale exclusion cannot mask real coverage.
        # A pull request runs every test module except the slow ones in
        # tests/suite_slow.json that it did not change (--changed --all-fast):
        # selecting by imports missed CLI-level tests and turned master red
        # (#232, #242, #330). Master and manual runs run everything. Test modules run side by
        # side, one per CPU.
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            .venv/bin/python tools/run_suite.py --verbosity 2 --changed "origin/${{ github.base_ref }}" --all-fast
          else
            .venv/bin/python tools/run_suite.py --verbosity 2
          fi
        env:
          PYTHONDONTWRITEBYTECODE: "1"

      - name: Run the scenario harness
        # scenarios/ is outside tests/: its catalog checks and scripted end-to-end runs
        # (scenarios/README.md) would otherwise never run in CI. Each test runs in its own
        # interpreter, one per CPU at a time; run serially the harness alone took about
        # 3.5 minutes. The other scenarios/test_*.py modules (adversarial attacks, native
        # runs) run here too: until #1088 nothing ran them, and they drifted. A pull request
        # leaves out the slow ones in tests/suite_slow.json unless it changes scenarios/ or
        # the suite machinery; master runs them all.
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            .venv/bin/python tools/run_suite.py --scenario-harness --verbosity 2 --changed "origin/${{ github.base_ref }}"
          else
            .venv/bin/python tools/run_suite.py --scenario-harness --verbosity 2
          fi
        env:
          PYTHONDONTWRITEBYTECODE: "1"

      - name: Run the dashboard suite
        # tools/dashboard/tests is outside tests/, so run_suite.py never
        # discovers it; run it here so it can't drift unnoticed again (#94).
        run: .venv/bin/python -m unittest discover -s tools/dashboard/tests -p 'test_*.py' -v
        env:
          PYTHONDONTWRITEBYTECODE: "1"

      - name: Verify chat, answers, Work, preview and recovery in real browsers
        # Read-only messages and exact-message confirmation must remain safe
        # with a pending question, after reload, and at narrow viewports.
        run: |
          .venv/bin/python - <<'PYTHON'
          import json, os, sys, tempfile
          from pathlib import Path
          from tests.browser_suite_process import run
          with tempfile.TemporaryDirectory(prefix="ab-", dir="/tmp") as sockets:
              env = {**os.environ, "AGENT_BROWSER_SOCKET_DIR": sockets,
                     "AUTOCODE_TEST_PYTHON": sys.executable}
              for script, cap in [("test_chat_intent_browser_ui.js", 180),
                                  ("test_work_summary_browser_ui.js", 240),
                                  ("test_question_cards_browser_ui.js", 240),
                                  ("test_preview_browser_ui.js", 240),
                                  ("test_recovery_browser_ui.js", 300),
                                  ("test_draft_cadence_browser_ui.js", 300),
                                  ("test_delete_browser_ui.js", 300),
                                  ("test_setup_browser_ui.js", 300),
                                  ("test_checkpoint_browser_ui.js", 300),
                                  ("test_scoped_start_browser_ui.js", 240)]:
                  try:
                      result = run(["node", "tools/dashboard/tests/" + script],
                                   cwd=Path.cwd(), env=env, timeout=cap)
                  except BaseException as error:
                      print(json.dumps(getattr(error, "receipt", {"error": str(error)})))
                      raise
                  print(json.dumps(result.receipt))
                  if result.returncode:
                      sys.exit(result.returncode)
          PYTHON

      - name: Run the dashboard Node tests
        # Browser checks invoked by Python tests run in the suite above.
        # Standalone browser matrices remain part of local visual acceptance;
        # the log names those omitted from this separate Node gate.
        run: |
          for test_file in tools/dashboard/tests/test_*.js; do
            if grep -q "agent-browser" "$test_file"; then
              echo "Standalone browser matrix (verified separately): $test_file"
              continue
            fi
            echo "node $test_file"
            node "$test_file" || exit 1
          done

  macos-tool-containment:
    # Target the real shell/Seatbelt boundary, without the slow macOS scenario suite
    # or the opt-in NativeToolTests that require a pinned OpenCode installation.
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and runtime dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -e .
      - name: Require native Seatbelt enforcement without skipped tests
        run: |
          .venv/bin/python - <<'PYTHON'
          import os
          import sys
          import unittest
          from pathlib import Path

          sandbox = Path("/usr/bin/sandbox-exec")
          if sys.platform != "darwin" or not sandbox.is_file() or not os.access(sandbox, os.X_OK):
              raise SystemExit("Native containment CI requires macOS and executable /usr/bin/sandbox-exec")

          names = (
              "tests.test_tool_containment.UnicodeKernelTests",
              "tests.test_tool_containment.KernelTests",
          )
          suite = unittest.TestSuite()
          for name in names:
              selected = unittest.defaultTestLoader.loadTestsFromName(name)
              if selected.countTestCases() == 0:
                  raise SystemExit(f"Native containment selection is empty: {name}")
              suite.addTests(selected)
          loaded = suite.countTestCases()
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if result.testsRun != loaded or result.skipped or result.expectedFailures or not result.wasSuccessful():
              raise SystemExit("Native containment CI requires every selected test to execute and pass without skips")
          PYTHON
        env:
          PYTHONDONTWRITEBYTECODE: "1"

  wheel-smoke:
    # The installed package, not the checkout (#67): build the wheel, install it into a
    # fresh venv, and run it from a folder outside any Git repository. A separate job,
    # so the suite above does not wait for it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build the wheel and install it into a fresh venv
        run: |
          python3 -m pip wheel --no-deps --wheel-dir "$RUNNER_TEMP/dist" .
          python3 -m venv "$RUNNER_TEMP/smoke"
          "$RUNNER_TEMP/smoke/bin/pip" install "$RUNNER_TEMP"/dist/*.whl
      - name: Run --version and doctor outside any repository
        # No engine is installed here, so doctor exits 1: check its JSON, not exit 0.
        run: |
          cd "$(mktemp -d)"
          if git rev-parse --git-dir >/dev/null 2>&1; then echo "::error::$PWD is inside a Git repository"; exit 1; fi
          "$RUNNER_TEMP/smoke/bin/autocode" --version | tee version.txt
          grep -q "(commit unknown)" version.txt
          code=0
          "$RUNNER_TEMP/smoke/bin/autocode" doctor --json > doctor.json || code=$?
          cat doctor.json
          [ "$code" -le 1 ] || { echo "::error::doctor exited $code"; exit 1; }
          python3 - doctor.json <<'PYTHON'
          import json, sys
          report = json.load(open(sys.argv[1]))
          checks = {check["name"]: check["status"] for check in report["checks"]}
          expected = {"python", "psutil", "git", "engine:opencode", "engine:codex", "engine", "workspace"}
          assert expected <= set(checks), sorted(expected - set(checks))
          assert all(checks[name] == "ok" for name in ("python", "psutil", "git")), checks
          assert checks["workspace"] == "missing" and report["ok"] is False, report
          PYTHON
      - name: Check installed provider-matrix rows outside the checkout
        run: |
          cd "$(mktemp -d)"
          "$RUNNER_TEMP/smoke/bin/python" -I "$GITHUB_WORKSPACE/tests/installed_provider_matrix.py" -v
      - name: Explain saved runs with the installed CLI without provider dispatch
        run: |
          cd "$(mktemp -d)"
          "$RUNNER_TEMP/smoke/bin/python" -I "$GITHUB_WORKSPACE/tests/installed_cli_explain.py" -v

  visual-comparison:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install image and browser test dependencies
        run: |
          python3 -m pip install -e '.[visual-test]'
          python3 -m playwright install --with-deps chromium
      - name: Run real-browser visual comparison controls
        run: python3 -m unittest tests.test_visual_check_browser -v
        env:
          AUTOCODE_REQUIRE_VISUAL_BROWSER: "1"
          PYTHONDONTWRITEBYTECODE: "1"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        id: lint-install
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -e '.[visual]'
          .venv/bin/python -m pip install -r requirements-lint.txt
      - name: Ruff lint
        if: ${{ !cancelled() && steps.lint-install.outcome == 'success' }}
        run: .venv/bin/ruff check tools/ tests/ scenarios/
      - name: Ruff format check
        if: ${{ !cancelled() && steps.lint-install.outcome == 'success' }}
        run: .venv/bin/ruff format --check tools/ tests/ scenarios/
      - name: Mypy type check
        if: ${{ !cancelled() && steps.lint-install.outcome == 'success' }}
        run: .venv/bin/mypy tools/
