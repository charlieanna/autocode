name: Stock host master control
on:
  workflow_dispatch:
jobs:
  stock-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install and bundle extension
        working-directory: vscode-extension
        run: |
          npm ci
          npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare CLI
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q bubblewrap xvfb
          python3 -m venv .venv
          .venv/bin/python -m pip install -e '.[test]'
      - name: Run unchanged stock host tests
        working-directory: vscode-extension
        run: xvfb-run -a node --test --test-concurrency=1 test/host/editor-host.test.cjs
      - name: Preserve host screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stock-host-master-screen
          path: vscode-extension/.vscode-test/host-last.png
          if-no-files-found: ignore
