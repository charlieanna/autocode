name: tests

on:
  push:
    branches: [master]
  pull_request:
  # A merge queue's candidate commit, when the repository has one: the same required gate.
  merge_group:
  # The nightly full run: every slow module and the whole scenario catalog, which the required
  # gate leaves out so that it finishes in minutes, not hours. A red night opens an issue.
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

# Two depths of the same checks (2026-11-23 audit: master took 4 to 6 hours per run, so 32 of 41
# runs were superseded before they finished and red merges went unseen for a day):
# - gate (pull_request, merge_group, push): every fast test module plus the slow ones a change
#   touches, in SUITE_SHARDS parallel runners, and the changed scenarios. This is ci-required.
# - full (schedule, workflow_dispatch): every module and every scenario, sharded the same way.
env:
  SUITE_SHARDS: "8"
  NIGHTLY_SUITE_SHARDS: "8"
  SCENARIO_SHARDS: "6"

concurrency:
  # Superseded runs of a non-master ref stop burning a full suite: rapid PR pushes
  # otherwise stack 45+ minute runs that no decision waits on (2026-10-10: five were
  # in flight at once). Master is different — its run is the integrated-tree verdict
  # every merge decision leans on, and with merge cadence (~10 min) below suite
  # duration (30-48 min) cancelling the in-flight run meant no master commit ever
  # delivered one (2026-10-11: five merge commits in a row, zero verdicts; #1048).
  # Master runs queue instead: a newer run supersedes only a pending run, never the
  # running one, so each window delivers a verdict and the queue drains to the
  # newest commit.
  # The nightly run has its own group, so a master push never waits behind it or supersedes it.
  group: ${{ github.workflow }}-${{ github.event_name == 'schedule' && 'nightly' || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' && github.event_name != 'merge_group' }}

jobs:
  scope:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      suite: ${{ steps.select.outputs.suite }}
      scenarios: ${{ steps.select.outputs.scenarios }}
      extension: ${{ steps.select.outputs.extension }}
      visual: ${{ steps.select.outputs.visual }}
      containers: ${{ steps.select.outputs.containers }}
      macos: ${{ steps.select.outputs.macos }}
      linux: ${{ steps.select.outputs.linux }}
      windows: ${{ steps.select.outputs.windows }}
      wheel: ${{ steps.select.outputs.wheel }}
      docs: ${{ steps.select.outputs.docs }}
      # gate or full, and the commit the gate's selection compares against (empty for full).
      mode: ${{ steps.depth.outputs.mode }}
      base: ${{ steps.depth.outputs.base }}
      suite_shards: ${{ steps.depth.outputs.suite_shards }}
      scenario_shards: ${{ steps.depth.outputs.scenario_shards }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Select affected checks
        id: select
        # Keep PR coverage tied to its pinned change and consumer mappings.
        # A failing base does not turn an unrelated repair into a full-suite run.
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            python tools/ci_scope.py --base "$BASE" --head "$HEAD" --github-output "$GITHUB_OUTPUT"
          else
            python tools/ci_scope.py --full --github-output "$GITHUB_OUTPUT"
          fi
      - name: Choose the run's depth
        id: depth
        # The gate selects by the event's pinned base: a PR's base, a merge-queue group's base, or the
        # commit a master push moved from. The nightly and manual runs take everything.
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          GROUP_BASE: ${{ github.event.merge_group.base_sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          python tools/ci_depth.py --event "$EVENT" --pr-base "$PR_BASE" --group-base "$GROUP_BASE" \
            --push-base "$PUSH_BASE" --suite-shards "$SUITE_SHARDS" --nightly-suite-shards "$NIGHTLY_SUITE_SHARDS" \
            --scenario-shards "$SCENARIO_SHARDS" --github-output "$GITHUB_OUTPUT"

  extension:
    needs: scope
    if: needs.scope.outputs.extension == 'true'
    # The VS Code client (#884) is TypeScript over the CLI, so its gate is Node, not
    # the Python suite. It reads only `--status` and `registry list --json`, so this
    # job needs no provider and spends no model allowance.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install the client's dependencies
        run: npm ci
        working-directory: vscode-extension
      - name: Typecheck
        run: npm run typecheck
        working-directory: vscode-extension
      - name: Test the CLI contract, editor commands and webview
        run: npm test
        working-directory: vscode-extension
      - name: Bundle
        run: npm run build
        working-directory: vscode-extension
      - name: Package the distributable
        run: npm run package -- --out /tmp/autocode.vsix
        working-directory: vscode-extension
      # A real VS Code Extension Host, driven offline (#3860): the extension runs this
      # checkout's CLI on a scripted Planner HTTP 401 run, with no model and no person.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Prepare the CLI for the Extension Host suite
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q bubblewrap fuse3 xvfb
          # The editor launches the same isolated verification shell as the Linux suite.
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          /usr/bin/unshare --user --map-current-user --mount --propagation private /bin/true
          python3 -m venv .venv
          .venv/bin/python -m pip install -e '.[test,coverage]' 'pytest-cov>=6,<8'
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.5"
          cache: false
      - name: Test held status reads and a blocked Planner in the Extension Host
        run: xvfb-run -a npm run test:host
        working-directory: vscode-extension
      - name: Keep the Extension Host's last screen
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: extension-host-screen
          path: vscode-extension/.vscode-test/host-*.png
          if-no-files-found: ignore
          include-hidden-files: true

  suite:
    needs: scope
    # Explicit, least privilege: the only write is the attribution comment the
    # red suite posts to its own pull request (#2603). Without this block the
    # default token's policy is whatever the repository's is, so the comment
    # silently warns and the verdict never reaches the author.
    permissions:
      contents: read
      pull-requests: write
    if: needs.scope.outputs.suite == 'true' || needs.scope.outputs.scenarios == 'true'
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu only since 2026-10-03: on GitHub's macOS runners the scenario harness took
        # 19 minutes against 4 on Ubuntu (each loopback request through the phase guard
        # stalled about 36 s there, not on a local Mac). Native Seatbelt checks run
        # separately in macos-tool-containment below.
        os: [ubuntu-latest]
        # One slice of the selection per runner (run_suite.py --shard), balanced by
        # tests/suite_durations.json. ci-required reads the matrix's combined result.
        shard: ${{ fromJSON(needs.scope.outputs.suite_shards) }}
    name: suite (${{ matrix.os }}, ${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ needs.scope.outputs.mode == 'full' && 300 || 60 }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, not the default shallow (depth-1) clone:
          # tests.test_catalogue_t14.SystematicCase.test_sys07_saved_failing_trace_replays
          # reads a specific historical commit (`git show <sha>:tools/autocode_support.py`)
          # to replay a saved regression, and a shallow clone doesn't have it.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        if: needs.scope.outputs.suite == 'true' || needs.scope.outputs.scenarios == 'true'
        with:
          node-version: "22"

      - uses: actions/setup-go@v5
        if: needs.scope.outputs.scenarios == 'true'
        with:
          go-version: "1.25.5"
          cache: false

      - name: Select installed Java 17 for scenario tests
        if: needs.scope.outputs.scenarios == 'true'
        # Ubuntu runners provide this JDK. Validate both tools and log their actual versions;
        # downloading an older release asset here has repeatedly failed with HTTP 504.
        run: python tools/ci_java.py

      - name: Prepare native Linux verification boundary
        if: runner.os == 'Linux' && needs.scope.outputs.suite == 'true'
        # Native readonly verification is exercised by the suite, so it needs
        # the same kernel backend as linux-tool-containment on this disposable VM.
        run: |
          sudo apt-get update -q
          # tmux: tests.test_chat_screens drives the full-screen chat in a real terminal (#1646).
          sudo apt-get install -y -q bubblewrap fuse3 libseccomp2 tmux
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          /usr/bin/bwrap --unshare-all --ro-bind / / --dev /dev --proc /proc -- /bin/true

      - name: Install package and runtime dependencies
        # Evidence-bound reuse requires an isolated, source-bound editable install.
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -e '.[visual,test]'

      - name: Verify privileged Linux CLI startup
        if: runner.os == 'Linux' && needs.scope.outputs.suite == 'true'
        run: |
          sudo env AUTOCODE_TEST_PRIVILEGED_STARTUP=1 .venv/bin/python -m unittest tests.test_capability_startup.LinuxCapabilityStartupTests tests.test_demo

      - name: Install RSpec for the RSpec proof tests
        if: runner.os == 'Linux' && needs.scope.outputs.suite == 'true'
        # tests.test_package_scope.PolyglotSuite proves a fix with a real `bundle exec rspec` (#2889);
        # it skips where Bundler or RSpec is missing. The runner image ships Ruby and Bundler.
        run: sudo gem install rspec -v 3.13.2 --no-document

      # Every suite shard and scenario shard needs the same pinned Maven and its dependencies. Fetching
      # them from Maven Central in each of up to 14 parallel jobs drew HTTP 429 and failed setup
      # (master run 45290041687), so the first job to fetch them saves them and the rest restore.
      - name: Restore pinned Java scenario dependencies
        id: java_cache
        if: needs.scope.outputs.scenarios == 'true'
        uses: actions/cache/restore@v4
        with:
          path: .scenario-runs/issue-696-java-toolchain
          key: java-toolchain-${{ runner.os }}-${{ hashFiles('scenarios/harness/java_toolchain.py', 'scenarios/catalog/feature-java-page-count/seed/**') }}

      - name: Prepare pinned Java scenario dependencies
        if: needs.scope.outputs.scenarios == 'true'
        run: |
          .venv/bin/python scenarios/harness/java_toolchain.py --root .scenario-runs/issue-696-java-toolchain
          echo "$PWD/.scenario-runs/issue-696-java-toolchain/bin" >> "$GITHUB_PATH"

      - name: Save pinned Java scenario dependencies
        if: needs.scope.outputs.scenarios == 'true' && steps.java_cache.outputs.cache-hit != 'true'
        continue-on-error: true  # another shard saving the same key first is not a failure
        uses: actions/cache/save@v4
        with:
          path: .scenario-runs/issue-696-java-toolchain
          key: ${{ steps.java_cache.outputs.cache-primary-key }}

      - name: Prepare suite evidence directory
        id: suite_evidence
        if: needs.scope.outputs.suite == 'true'
        run: |
          evidence_directory="${RUNNER_TEMP:?}/autocode-suite-evidence"
          mkdir -p "$evidence_directory"
          echo "directory=$evidence_directory" >> "$GITHUB_OUTPUT"

      - name: Record the checkout the suite will test
        if: needs.scope.outputs.suite == 'true' && github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          SUITE_EVIDENCE_DIR: ${{ steps.suite_evidence.outputs.directory }}
        run: |
          .venv/bin/python tools/ci_tested_source.py --expected-head "$PR_HEAD" --event-base "$BASE" --out "$SUITE_EVIDENCE_DIR/.suite-source.json" || echo "Source capture unavailable; attribution will remain unresolved."

      - name: Run the suite gate
        id: suite_gate
        if: needs.scope.outputs.suite == 'true'
        # tools/run_suite.py wraps the same discovery as
        # `python -m unittest discover -s tests -t . -p 'test_*.py'`, minus
        # the modules documented in tests/suite_exclusions.json (each with a
        # recorded reason). It fails if any non-excluded test fails, and
        # separately fails if an exclusion entry no longer matches anything
        # discovered, so a stale exclusion cannot mask real coverage.
        # The gate (PRs, a merge queue, master pushes) runs every fast module and the slow
        # ones the change touches or a mapped consumer needs, against the event's pinned base,
        # so a break in a module the change does not import still blocks it. The nightly and
        # manual runs take every module, slow ones included. Each runner takes one shard;
        # test modules run side by side, one per CPU.
        env:
          MODE: ${{ needs.scope.outputs.mode }}
          BASE: ${{ needs.scope.outputs.base }}
          SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
          PYTHONDONTWRITEBYTECODE: "1"
          SUITE_EVIDENCE_DIR: ${{ steps.suite_evidence.outputs.directory }}
        run: |
          if [ "$MODE" = gate ]; then
            .venv/bin/python tools/run_suite.py --verbosity 2 --changed "$BASE" --all-fast --shard "$SHARD" --failed-out "$SUITE_EVIDENCE_DIR/.suite-failed.json"
          else
            .venv/bin/python tools/run_suite.py --verbosity 2 --shard "$SHARD" --failed-out "$SUITE_EVIDENCE_DIR/.suite-failed.json"
          fi

      - name: Attribute red to base or head
        # A red suite does not say whose failure it is, so an agent debugs its own
        # breakage and somebody else's alike (#2603). Run only the failing modules
        # against the captured checkout's verified comparison base. The event base
        # still selects tests; it need not be a merge checkout's actual first parent.
        # Informational: ci-required is what blocks the merge.
        if: ${{ failure() && github.event_name == 'pull_request' && steps.suite_gate.outcome == 'failure' }}
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          SUITE_EVIDENCE_DIR: ${{ steps.suite_evidence.outputs.directory }}
        run: |
          .venv/bin/python tools/attribute_failure.py --base "$BASE" --expected-head "$PR_HEAD" --tested-source "$SUITE_EVIDENCE_DIR/.suite-source.json" --failed "$SUITE_EVIDENCE_DIR/.suite-failed.json" --json "$SUITE_EVIDENCE_DIR/.attribution.json" | tee "$SUITE_EVIDENCE_DIR/.attribution.md"
          if [ -s "$SUITE_EVIDENCE_DIR/.attribution.md" ]; then
            cat "$SUITE_EVIDENCE_DIR/.attribution.md" >> "$GITHUB_STEP_SUMMARY"
            gh pr comment "$PR" --body-file "$SUITE_EVIDENCE_DIR/.attribution.md" || echo "could not post the attribution comment"
          else
            echo "Failure attribution is incomplete; no comment was posted." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Preserve suite attribution receipts
        uses: actions/upload-artifact@v4
        if: ${{ always() && github.event_name == 'pull_request' && steps.suite_gate.outcome == 'failure' }}
        with:
          name: suite-attribution-${{ matrix.os }}-${{ matrix.shard }}
          path: |
            ${{ steps.suite_evidence.outputs.directory }}/.suite-source.json
            ${{ steps.suite_evidence.outputs.directory }}/.suite-failed.json
            ${{ steps.suite_evidence.outputs.directory }}/.attribution.json
            ${{ steps.suite_evidence.outputs.directory }}/.attribution.md
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7

  scenario-harness:
    needs: scope
    if: needs.scope.outputs.scenarios == 'true'
    strategy:
      fail-fast: false
      matrix:
        # One shard for the gate's changed selection, SCENARIO_SHARDS for the full catalog.
        shard: ${{ fromJSON(needs.scope.outputs.scenario_shards) }}
    name: scenario-harness (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, not the default shallow (depth-1) clone:
          # tests.test_catalogue_t14.SystematicCase.test_sys07_saved_failing_trace_replays
          # reads a specific historical commit (`git show <sha>:tools/autocode_support.py`)
          # to replay a saved regression, and a shallow clone doesn't have it.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        if: needs.scope.outputs.scenarios == 'true'
        with:
          node-version: "22"

      - uses: actions/setup-go@v5
        if: needs.scope.outputs.scenarios == 'true'
        with:
          go-version: "1.25.5"
          cache: false

      - name: Select installed Java 17 for scenario tests
        if: needs.scope.outputs.scenarios == 'true'
        # Ubuntu runners provide this JDK. Validate both tools and log their actual versions;
        # downloading an older release asset here has repeatedly failed with HTTP 504.
        run: python tools/ci_java.py

      - name: Prepare native Linux verification boundary
        if: runner.os == 'Linux'
        # Supervised fake providers use the same supported Linux verification boundary
        # as real providers and the unit gate on this disposable VM.
        run: |
          sudo apt-get update -q
          # tmux: tests.test_chat_screens drives the full-screen chat in a real terminal (#1646).
          sudo apt-get install -y -q bubblewrap fuse3 libseccomp2 tmux
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          /usr/bin/bwrap --unshare-all --ro-bind / / --dev /dev --proc /proc -- /bin/true

      - name: Install package and runtime dependencies
        # Evidence-bound reuse requires an isolated, source-bound editable install.
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -e '.[visual,test]'

      - name: Verify privileged Linux CLI startup
        if: runner.os == 'Linux'
        run: |
          sudo env AUTOCODE_TEST_PRIVILEGED_STARTUP=1 .venv/bin/python -m unittest tests.test_capability_startup.LinuxCapabilityStartupTests tests.test_demo

      # Every suite shard and scenario shard needs the same pinned Maven and its dependencies. Fetching
      # them from Maven Central in each of up to 14 parallel jobs drew HTTP 429 and failed setup
      # (master run 45290041687), so the first job to fetch them saves them and the rest restore.
      - name: Restore pinned Java scenario dependencies
        id: java_cache
        if: needs.scope.outputs.scenarios == 'true'
        uses: actions/cache/restore@v4
        with:
          path: .scenario-runs/issue-696-java-toolchain
          key: java-toolchain-${{ runner.os }}-${{ hashFiles('scenarios/harness/java_toolchain.py', 'scenarios/catalog/feature-java-page-count/seed/**') }}

      - name: Prepare pinned Java scenario dependencies
        if: needs.scope.outputs.scenarios == 'true'
        run: |
          .venv/bin/python scenarios/harness/java_toolchain.py --root .scenario-runs/issue-696-java-toolchain
          echo "$PWD/.scenario-runs/issue-696-java-toolchain/bin" >> "$GITHUB_PATH"

      - name: Save pinned Java scenario dependencies
        if: needs.scope.outputs.scenarios == 'true' && steps.java_cache.outputs.cache-hit != 'true'
        continue-on-error: true  # another shard saving the same key first is not a failure
        uses: actions/cache/save@v4
        with:
          path: .scenario-runs/issue-696-java-toolchain
          key: ${{ steps.java_cache.outputs.cache-primary-key }}

      - name: Run the scenario harness
        if: needs.scope.outputs.scenarios == 'true'
        # The gate runs the scenarios its pinned change selects; the nightly and manual runs
        # take the whole catalog. This independent job lets long unit and harness gates each
        # use their own hosted-runner budget, and runs even when the unit gate finds a failure.
        run: |
          if [ "$MODE" = gate ]; then
            .venv/bin/python tools/run_suite.py --scenario-harness --verbosity 2 --changed "$BASE" --shard "$SHARD"
          else
            .venv/bin/python tools/run_suite.py --scenario-harness --verbosity 2 --shard "$SHARD"
          fi
        env:
          MODE: ${{ needs.scope.outputs.mode }}
          BASE: ${{ needs.scope.outputs.base }}
          SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
          PYTHONDONTWRITEBYTECODE: "1"

  diff-coverage:
    needs: scope
    # Advisory (#2754): which changed tools/ lines no selected test executes. It runs the
    # same --changed selection as the suite, in its own venv with coverage.py, so the gate
    # above never runs with a coverage tool installed. Not in ci-required, and its
    # steps never fail the job; the suite job is still the verdict on the tests.
    if: github.event_name == 'pull_request' && needs.scope.outputs.suite == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Prepare native Linux verification boundary
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q bubblewrap fuse3 libseccomp2 tmux
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Install package with coverage.py
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -e '.[visual,test,coverage]'
      - name: Run the changed selection under coverage
        continue-on-error: true
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          .venv/bin/python tools/ci_diff_coverage.py run --data-dir "$RUNNER_TEMP/diff-coverage" -- \
            .venv/bin/python tools/run_suite.py --changed "$BASE"
      - name: Report changed lines no test executed
        if: ${{ !cancelled() }}
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          .venv/bin/python tools/ci_diff_coverage.py report --base "$BASE" \
            --coverage-json "$RUNNER_TEMP/diff-coverage/coverage.json" \
            --summary "$GITHUB_STEP_SUMMARY" --json-out "$RUNNER_TEMP/diff-coverage/report.json"

  macos-tool-containment:
    needs: scope
    if: needs.scope.outputs.macos == 'true'
    # Target the real shell/Seatbelt boundary, without the slow macOS scenario suite
    # or the opt-in NativeToolTests that require a pinned OpenCode installation.
    # Native readonly checks are admitted only here (macOS Seatbelt and the Command Line
    # Tools Git), so their gated tests run in this job; the suite job skips them on Linux.
    runs-on: macos-15
    # Raised from 10: the native check classes add about 70 supervised Seatbelt launches
    # (five Git setup commands and one check per native run), and the owner-loss test alone
    # may wait up to 5 minutes for readiness, so a slow or failing run still reports.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the contained Bash runtime
        run: brew install bash
      - name: Install package and runtime dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -e .
      - name: Require native Seatbelt enforcement without skipped tests
        run: |
          .venv/bin/python - <<'PYTHON'
          import os
          import sys
          import unittest
          from pathlib import Path

          sandbox = Path("/usr/bin/sandbox-exec")
          if sys.platform != "darwin" or not sandbox.is_file() or not os.access(sandbox, os.X_OK):
              raise SystemExit("Native containment CI requires macOS and executable /usr/bin/sandbox-exec")

          names = (
              "tests.test_tool_containment.UnicodeKernelTests",
              "tests.test_tool_containment.KernelTests",
              # Kilo's own Bash child runs under its client profile alone (#3812).
              "tests.test_kilo_isolation.ClientPolicyKernelTests",
              # Every class with a test gated on requires_native_check_host.
              "tests.test_native_check_execution.NativeCheckExecutionTests",
              "tests.test_native_check_execution.FixedNativeGitSetupFactsTests",
              "tests.test_native_check_execution.NativeCheckDeadlineTests",
              "tests.test_native_check_execution.NativeCheckOwnerLossTests",
              "tests.test_native_initial_callers.OriginalCheckFailureTests",
              # --agent-sandbox around a whole agent process (Seatbelt).
              "tests.test_agent_sandbox.KernelTests",
          )
          suite = unittest.TestSuite()
          for name in names:
              selected = unittest.defaultTestLoader.loadTestsFromName(name)
              if selected.countTestCases() == 0:
                  raise SystemExit(f"Native containment selection is empty: {name}")
              suite.addTests(selected)
          loaded = suite.countTestCases()
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if result.testsRun != loaded or result.skipped or result.expectedFailures or not result.wasSuccessful():
              raise SystemExit("Native containment CI requires every selected test to execute and pass without skips")
          PYTHON
        env:
          PYTHONDONTWRITEBYTECODE: "1"

  linux-tool-containment:
    needs: scope
    if: needs.scope.outputs.linux == 'true'
    # The Linux bubblewrap boundary (#709), as macos-tool-containment checks Seatbelt: the
    # kernel controls must run, not skip. Ubuntu restricts unprivileged user namespaces
    # through AppArmor; a runner is a throwaway VM, so the job lifts that restriction.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install bubblewrap and allow unprivileged user namespaces
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q bubblewrap fuse3 libseccomp2 python3-venv
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          /usr/bin/bwrap --version
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.5"
          cache: false
      - name: Install package and runtime dependencies
        # The distribution's Python: its runtime is under /usr, which the boundary mounts.
        run: |
          /usr/bin/python3 -m venv .venv
          .venv/bin/python -m pip install -e .
      - name: Require native bubblewrap enforcement without skipped tests
        run: |
          .venv/bin/python - <<'PYTHON'
          import sys
          import unittest

          sys.path.insert(0, "tools")
          import autocode_tool_containment as containment

          problem = containment.sandbox_problem()
          if containment.backend() != containment.BUBBLEWRAP or problem:
              raise SystemExit(f"Native containment CI requires a working Linux bubblewrap: {problem}")

          names = (
              "tests.test_tool_containment.UnicodeKernelTests",
              "tests.test_tool_containment.KernelTests",
              "tests.test_tool_containment.BubblewrapKernelTests",
              "tests.test_toolchain.SelectedToolchainTests",
              "tests.test_elf_dependencies.LoaderFixtureTests",
              "tests.test_native_linux_boundary.NativeLinuxKernelTests",
              "tests.test_native_linux_check.NativeLinuxCheckTests",
              "tests.test_native_check_execution.NativeCheckExecutionTests",
              "tests.test_native_check_execution.FixedNativeGitSetupFactsTests",
              "tests.test_native_check_execution.NativeCheckDeadlineTests",
              "tests.test_native_check_execution.NativeCheckOwnerLossTests",
              "tests.test_native_initial_callers.OriginalCheckFailureTests",
              "tests.test_kilo_linux_boundary.KiloLinuxBoundaryTests.test_pure_allows_threads_but_denies_process_fork_and_network",
              "tests.test_kilo_linux_boundary.KiloLinuxBoundaryTests.test_client_runs_discovered_python_through_external_symlink",
              "tests.test_kilo_linux_boundary.KiloLinuxBoundaryTests.test_prepared_shell_inherits_the_client_verification_view",
              "tests.test_kilo_linux_boundary.KiloLinuxBoundaryTests.test_unix_relay_is_reachable_while_foreign_socket_and_host_network_are_absent",
              "tests.test_kilo_linux_boundary.KiloLinuxBoundaryTests.test_original_namespace_pid1_is_bound_but_its_forked_peer_is_refused",
              "tests.test_kilo_linux_boundary.KiloLinuxBoundaryTests.test_policy_filter_and_command_tampering_refuse",
              # A fake OpenCode run through the CLI whose Builder, Tester and Completion Reviewer launch
              # contained, and the uncontained control for its planted write outside the workspace.
              "tests.test_contained_fake_cli.ContainedFakeOpenCodeFlow",
              # --agent-sandbox around a whole agent process, and a fake Codex run with every stage inside it.
              "tests.test_agent_sandbox.KernelTests",
              "tests.test_agent_sandbox.SandboxedFakeCodexFlow",
          )
          suite = unittest.TestSuite()
          for name in names:
              selected = unittest.defaultTestLoader.loadTestsFromName(name)
              if selected.countTestCases() == 0:
                  raise SystemExit(f"Native containment selection is empty: {name}")
              suite.addTests(selected)
          loaded = suite.countTestCases()
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if result.testsRun != loaded or result.skipped or result.expectedFailures or not result.wasSuccessful():
              raise SystemExit("Native containment CI requires every selected test to execute and pass without skips")
          PYTHON
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          AUTOCODE_NATIVE_LINUX_BOUNDARY_TEST: "1"

  windows-fast-suite:
    needs: scope
    if: needs.scope.outputs.windows == 'true'
    # Native Windows progress report (#698), not a gate yet. Every step that can fail is
    # continue-on-error and the job is too, so this job can never fail the workflow or
    # turn master red; read the outcome in the job summary. docs/windows.md lists what
    # is known not to work natively. Make it required (drop continue-on-error) once green.
    runs-on: windows-latest
    continue-on-error: true
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and runtime dependencies
        id: install
        continue-on-error: true
        run: |
          python -m venv .venv
          .venv/Scripts/python -m pip install -e .
      - name: Run autocode --version and doctor
        id: doctor
        continue-on-error: true
        # The CLI imports the whole runtime, so this fails first on a POSIX-only import
        # (tests/test_windows_portability.py lists them). No engine is installed here, so
        # doctor exits 1: accept 0 or 1, as wheel-smoke does.
        run: |
          .venv/Scripts/autocode --version
          code=0
          .venv/Scripts/autocode doctor --json || code=$?
          [ "$code" -le 1 ] || { echo "::warning::autocode doctor exited $code on Windows"; exit 1; }
      - name: Run the fast suite
        id: suite
        continue-on-error: true
        timeout-minutes: 45
        # Every fast module: --changed against HEAD selects nothing extra, --all-fast adds the rest.
        # A module still running after 10 minutes is ended and named as timed out (#1681), so one
        # hung module cannot run into the step limit and hide which one it was.
        run: .venv/Scripts/python tools/run_suite.py --verbosity 2 --changed HEAD --all-fast --module-timeout 600
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONUTF8: "1"
      - name: Summarize native Windows results
        if: ${{ always() }}
        run: |
          {
            echo "### Native Windows (#698, allowed to fail)"
            echo "- install: ${{ steps.install.outcome }}"
            echo "- doctor: ${{ steps.doctor.outcome }}"
            echo "- fast suite: ${{ steps.suite.outcome }}"
          } >> "$GITHUB_STEP_SUMMARY"

  wheel-smoke:
    needs: scope
    if: needs.scope.outputs.wheel == 'true'
    # The installed package, not the checkout (#67): build the wheel, install it into a
    # fresh venv, and run it from a folder outside any Git repository. A separate job,
    # so the suite above does not wait for it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build the wheel and install it into a fresh venv
        run: |
          python3 -m pip wheel --no-deps --wheel-dir "$RUNNER_TEMP/dist" .
          python3 -m venv "$RUNNER_TEMP/smoke"
          "$RUNNER_TEMP/smoke/bin/pip" install "$RUNNER_TEMP"/dist/*.whl
      - name: Run --version and doctor outside any repository
        # No engine is installed here, so doctor exits 1: check its JSON, not exit 0.
        run: |
          cd "$(mktemp -d)"
          if git rev-parse --git-dir >/dev/null 2>&1; then echo "::error::$PWD is inside a Git repository"; exit 1; fi
          "$RUNNER_TEMP/smoke/bin/autocode" --version | tee version.txt
          grep -q "(commit unknown)" version.txt
          code=0
          "$RUNNER_TEMP/smoke/bin/autocode" doctor --json > doctor.json || code=$?
          cat doctor.json
          [ "$code" -le 1 ] || { echo "::error::doctor exited $code"; exit 1; }
          python3 - doctor.json <<'PYTHON'
          import json, sys
          report = json.load(open(sys.argv[1]))
          checks = {check["name"]: check["status"] for check in report["checks"]}
          expected = {"python", "psutil", "git", "engine:opencode", "engine:codex", "engine", "workspace"}
          assert expected <= set(checks), sorted(expected - set(checks))
          assert all(checks[name] == "ok" for name in ("python", "psutil", "git")), checks
          # A folder outside Git is ready: a task sets it up itself. No engine is installed, so doctor is not ok.
          assert checks["workspace"] == "ok" and report["ok"] is False, report
          PYTHON
      - name: Check installed provider-matrix rows outside the checkout
        run: |
          cd "$(mktemp -d)"
          "$RUNNER_TEMP/smoke/bin/python" -I "$GITHUB_WORKSPACE/tests/installed_provider_matrix.py" -v
      - name: Explain saved runs with the installed CLI without provider dispatch
        run: |
          cd "$(mktemp -d)"
          "$RUNNER_TEMP/smoke/bin/python" -I "$GITHUB_WORKSPACE/tests/installed_cli_explain.py" -v
      - name: Bind installed prompt resources to the reviewed source
        run: |
          cd "$(mktemp -d)"
          "$RUNNER_TEMP/smoke/bin/python" -I "$GITHUB_WORKSPACE/tests/installed_prompt_resources.py"

  visual-comparison:
    needs: scope
    if: needs.scope.outputs.visual == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install image and browser test dependencies
        run: |
          python3 -m pip install -e '.[visual-test]'
          python3 -m playwright install --with-deps chromium
      - name: Run real-browser visual comparison controls
        run: python3 -m unittest tests.test_visual_check_browser -v
        env:
          AUTOCODE_REQUIRE_VISUAL_BROWSER: "1"
          PYTHONDONTWRITEBYTECODE: "1"

  lint:
    needs: scope
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        id: lint-install
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -e '.[visual]'
          .venv/bin/python -m pip install -r requirements-lint.txt
      - name: Ruff lint
        if: ${{ !cancelled() && steps.lint-install.outcome == 'success' }}
        run: .venv/bin/ruff check tools/ tests/ scenarios/
      - name: Ruff format check
        if: ${{ !cancelled() && steps.lint-install.outcome == 'success' }}
        run: .venv/bin/ruff format --check tools/ tests/ scenarios/
      - name: Mypy type check
        if: ${{ !cancelled() && steps.lint-install.outcome == 'success' }}
        run: .venv/bin/mypy tools/

  ci-required:
    # One stable required check: a skipped unrelated job is expected, while a
    # failed scope selection or a selected job that fails/cancels cannot pass.
    needs: [scope, suite, scenario-harness, extension, macos-tool-containment, linux-tool-containment, windows-fast-suite, wheel-smoke, visual-comparison, lint]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every selected check
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          import sys

          needs = json.loads(os.environ["NEEDS"])
          if needs["scope"]["result"] != "success":
              sys.exit("CI scope selection did not pass")
          scope = needs["scope"]["outputs"]
          flags = ("suite", "scenarios", "extension", "visual", "containers",
                   "macos", "linux", "windows", "wheel", "docs")
          if any(scope.get(flag) not in ("true", "false") for flag in flags):
              sys.exit("CI scope selection returned incomplete outputs")
          selected = {
              "suite": any(scope[flag] == "true" for flag in ("suite", "scenarios")),
              "scenario-harness": scope["scenarios"] == "true",
              "extension": scope["extension"] == "true",
              "macos-tool-containment": scope["macos"] == "true",
              "linux-tool-containment": scope["linux"] == "true",
              "windows-fast-suite": scope["windows"] == "true",
              "wheel-smoke": scope["wheel"] == "true",
              "visual-comparison": scope["visual"] == "true",
              "lint": True,
          }
          failures = []
          for job, required in selected.items():
              expected = "success" if required else "skipped"
              actual = needs[job]["result"]
              print(f"{job}: {actual} (expected {expected})")
              if actual != expected:
                  failures.append(job)
          if failures:
              sys.exit("Selected CI checks did not pass: " + ", ".join(failures))
          PYTHON

  nightly-report:
    # A red nightly run must reach whoever merges next, not wait for someone to open the Actions tab:
    # it opens (or comments on) one "Nightly full CI is red" issue, and a green night closes it.
    needs: [ci-required]
    if: ${{ always() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Open, update or close the nightly issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESULT: ${{ needs.ci-required.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: python3 tools/ci_nightly_issue.py --result "$RESULT" --run-url "$RUN_URL" --sha "$SHA"
