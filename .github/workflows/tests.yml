name: tests

on:
  workflow_dispatch:

jobs:
  master-editor-control:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare isolated offline extension host
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q bubblewrap xvfb
          python3 -m venv .venv
          .venv/bin/python -m pip install -e '.[test]'
          cd vscode-extension
          npm ci
          npm run build
      - name: Run behavior-level master controls
        run: xvfb-run -a node --test --test-concurrency=1 test/host/status-retry.test.cjs
        working-directory: vscode-extension
      - name: Retain last editor screen
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: master-control-screen
          path: vscode-extension/.vscode-test/host-last.png
          if-no-files-found: ignore
