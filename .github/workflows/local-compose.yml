name: local-compose

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  local-compose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install checkout dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -e .
      - name: Exercise two real containers and prove both teardowns
        run: .venv/bin/python -m unittest tests.test_local_compose_scenario.RealDockerTests -v
        env:
          AUTOCODE_TEST_REAL_DOCKER: '1'
          PYTHONDONTWRITEBYTECODE: '1'
