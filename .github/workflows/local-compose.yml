name: local-compose

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      containers: ${{ steps.select.outputs.containers }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Select affected checks
        id: select
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            python tools/ci_scope.py --base "$BASE" --head "$HEAD" --github-output "$GITHUB_OUTPUT"
          else
            python tools/ci_scope.py --full --github-output "$GITHUB_OUTPUT"
          fi

  local-compose:
    needs: scope
    if: needs.scope.outputs.containers == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install checkout dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -e .
      - name: Exercise two real containers and prove both teardowns
        run: .venv/bin/python -m unittest tests.test_local_compose_scenario.RealDockerTests -v
        env:
          AUTOCODE_TEST_REAL_DOCKER: '1'
          PYTHONDONTWRITEBYTECODE: '1'
